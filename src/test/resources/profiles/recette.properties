# Recette (OpenShift ocpdev). No secret in this file: keys and DB credentials come from the
# environment or the workstation .env (see .env.example).
perf.env=recette
selfcare.baseUrl=https://recette-api-titres-selfcare-services.apps.ocpdev.attijariwafa.net

# OpenShift objects the harness snapshots and samples
oc.context=
oc.namespace.services=recette-titres-selfcare-services
oc.namespace.datas=recette-titres-selfcare-datas
oc.selector.api=app=api-titres-selfcare
oc.selector.worker=app=api-titres-selfcare-orders-worker

# Megara recette (CUSTPPRD): the orders tables the analysis reads
db.dsn=172.31.147.56:2016/CUSTPPRD
db.schema=AWBMEGARA

metrics.sampleSeconds=15

# Orders booked by the campaign
orders.source=PERF
orders.quantity=1
# Limit price offset from the reference price, inside the 35 % band: the order rests in the
# book and never fills, so no execution or settlement leg runs by accident.
orders.priceOffsetPercent=30
orders.tickSize=0.01
orders.validity=DAY
orders.cashCaller=titres-trading-performance-tests
# Seconds between two orders of the same client in the closed model (-Dperf.paceSeconds overrides)
orders.paceSeconds=5

# Client-side poll of the order until it reaches the market (status 105)
poll.intervalMs=500
poll.timeoutMs=20000

# Guard rails
limits.maxOrdersPerCampaign=500
limits.abort5xxPercent=5
limits.abortWindowSeconds=60

data.accounts=data/recette/accounts.csv
data.instruments=data/recette/instruments.csv
