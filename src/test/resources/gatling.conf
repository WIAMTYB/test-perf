gatling {
  core {
    outputDirectoryBaseName = ""
    encoding = "utf-8"
  }
  http {
    ssl {
      # The recette and preprod routes carry certificates of the internal CA.
      useInsecureTrustManager = true
    }
    ahc {
      connectTimeout = 10000
      requestTimeout = 60000
    }
  }
  charting {
    indicators {
      lowerBound = 500
      higherBound = 2000
      percentile1 = 50
      percentile2 = 75
      percentile3 = 95
      percentile4 = 99
    }
  }
}
